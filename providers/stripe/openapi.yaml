  /health:
    get:
      summary: Check application and database
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: *id002
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: *id003
                  message: *id003
                required:
                - code
                - message
  /__sim/accounts:
