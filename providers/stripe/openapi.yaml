      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[A-Za-z0-9._:-]+$
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                payment_method: &id003
                  type: string
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /v1/payment_intents/{id}/capture:
    post:
      summary: Capture the full reserved amount once
      responses:
        '200':
