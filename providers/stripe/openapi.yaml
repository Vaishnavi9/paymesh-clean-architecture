          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - SimulatorAdmin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transientFailures:
                  type: integer
                  minimum: 0
                  maximum: 10
                loseResponse:
                  type: boolean
                delayMs:
                  type: integer
                  minimum: 0
                  maximum: 30000
    parameters:
    - name: reference
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
components:
  securitySchemes:
    ProviderKey:
      type: http
      scheme: bearer
      description: 'LOCAL key: local-stripe-key'
    SimulatorAdmin:
      type: apiKey
      in: header
      name: X-Simulator-Admin-Key
  schemas:
    Error:
      type: object
      properties:
        code: &id004
          type: string
        message: *id004
      required:
      - code
      - message
    PaymentIntent:
      type: object
      properties:
        id: *id004
        object:
          const: payment_intent
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 99999999
        currency:
          enum:
          - eur
          - usd
        status:
          enum:
          - requires_payment_method
          - requires_confirmation
          - requires_capture
          - processing
          - succeeded
        payment_method:
          type:
          - string
          - 'null'
        capture_method:
          enum:
          - automatic
          - manual
        amount_received:
          type: integer
          format: int64
        amount_capturable:
          type: integer
          format: int64
        metadata:
          type: object
          properties:
            order_reference: *id004
        last_payment_error: &id005
          type: object
          additionalProperties: true
      required:
      - id
      - status
      - amount
      - currency
    AdyenResult:
      type: object
      properties:
        pspReference: *id004
        merchantReference: *id004
        resultCode:
          enum:
          - Pending
          - Authorised
          - Refused
        refusalReason: *id004
      required:
      - pspReference
      - resultCode
    Order:
      type: object
      properties:
        id: *id004
        status:
          enum:
          - CREATED
          - APPROVED
          - COMPLETED
        intent:
          const: CAPTURE
        purchase_units:
          type: array
          items: *id005
        links:
          type: array
          items: *id005
      required:
      - id
      - status
      - intent
