  /__sim/scenarios/{reference}:
    put:
      summary: Configure faults BEFORE creating a payment (LOCAL)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: *id002
        '400':
          description: Invalid input
          content:
            application/json:
