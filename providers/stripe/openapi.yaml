openapi: 3.1.0
info:
  title: PayMesh Stripe-inspired LOCAL simulator
  version: 1.0.0
  description: Supported local subset, not a drop-in replacement for the commercial
    provider. Only seeded fake tokens and money. EUR/USD only. Read README for compatibility
    boundaries. Bearer tokens are fixed LOCAL development keys; no external OAuth
    service is contacted. All /__sim operations are local extensions requiring the
    admin key. No idempotency expiry is applied in this lab. Post-commit response
    loss is an injected HTTP 504.
servers:
- url: http://127.0.0.1:18101
security:
- ProviderKey: []
paths:
  /v1/payment_intents:
    post:
      summary: Create an intent; optionally confirm it
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: &id001
                $ref: '#/components/schemas/PaymentIntent'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid local credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Merchant not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State conflict, key mismatch or concurrent request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Injected post-commit response failure; retry the same key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Business decline
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: &id002
                    type: object
                    additionalProperties: true
                required:
                - error
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[A-Za-z0-9._:-]+$
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                amount:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 99999999
                currency:
                  enum:
                  - eur
                  - usd
                metadata[order_reference]:
                  type: string
                  minLength: 1
                  maxLength: 100
                payment_method:
                  enum:
                  - pm_funded
                  - pm_low
                  - pm_blocked
                  - pm_usd
                confirm:
                  type: boolean
                  default: false
                capture_method:
                  enum:
                  - automatic
                  - manual
                  default: automatic
              required:
              - amount
              - currency
              - metadata[order_reference]
  /v1/payment_intents/{id}:
    get:
      summary: Retrieve current intent state
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: *id001
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid local credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Merchant not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State conflict, key mismatch or concurrent request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Injected post-commit response failure; retry the same key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /v1/payment_intents/{id}/confirm:
    post:
      summary: Confirm and reserve funds; automatic capture if selected
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: *id001
        '400':
