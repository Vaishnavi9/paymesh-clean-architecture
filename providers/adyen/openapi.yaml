        '409':
          description: State conflict, key mismatch or concurrent request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Injected post-commit response failure; retry the same key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9._:-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                merchantAccount:
                  const: merchant-demo
                reference: *id001
                amount: *id002
              required:
              - merchantAccount
              - reference
              - amount
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /__sim/payments/{id}/result:
    get:
      summary: 'LOCAL extension: inspect authorisation result'
      responses:
        '200':
          description: Success
          content:
