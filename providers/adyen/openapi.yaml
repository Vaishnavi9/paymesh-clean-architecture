  /__sim/scenarios/{reference}:
    put:
      summary: Configure faults BEFORE creating a payment (LOCAL)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: *id004
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
