      security:
      - SimulatorAdmin: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /health:
    get:
      summary: Check application and database
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: &id004
                type: object
                additionalProperties: true
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: *id001
                  message: *id001
                required:
                - code
                - message
  /__sim/accounts:
