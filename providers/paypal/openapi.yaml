        '504':
          description: Injected post-commit response failure; retry the same key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Funding instrument declined
          content:
            application/json:
              schema: &id002
                type: object
                additionalProperties: true
      parameters:
      - in: header
        name: PayPal-Request-Id
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 38
          pattern: ^[A-Za-z0-9._:-]+$
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
