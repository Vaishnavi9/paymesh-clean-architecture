                $ref: '#/components/schemas/Error'
        '504':
          description: Injected post-commit response failure; retry the same key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /v2/checkout/orders/{id}/capture:
    post:
      summary: Capture an approved order
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: *id001
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
