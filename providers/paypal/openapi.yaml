openapi: 3.1.0
info:
  title: PayMesh PayPal-inspired LOCAL simulator
  version: 1.0.0
  description: Supported local subset, not a drop-in replacement for the commercial
    provider. Only seeded fake tokens and money. EUR/USD only. Read README for compatibility
    boundaries. Bearer tokens are fixed LOCAL development keys; no external OAuth
    service is contacted. All /__sim operations are local extensions requiring the
    admin key. No idempotency expiry is applied in this lab. Post-commit response
    loss is an injected HTTP 504.
servers:
- url: http://127.0.0.1:18103
security:
- ProviderKey: []
paths:
  /v2/checkout/orders:
    post:
      summary: Create an order; no funds move
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: &id001
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid local credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Merchant not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State conflict, key mismatch or concurrent request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Injected post-commit response failure; retry the same key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: header
        name: PayPal-Request-Id
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 38
          pattern: ^[A-Za-z0-9._:-]+$
      - name: X-Simulator-Payment-Method
        in: header
        required: false
        description: LOCAL extension selecting fake payer funds; not a PayPal header.
        schema:
          type: string
          enum:
          - pm_funded
          - pm_low
          - pm_blocked
          - pm_usd
          default: pm_funded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                intent:
                  const: CAPTURE
                purchase_units:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: object
                    properties:
                      custom_id: &id003
                        type: string
                      amount:
                        type: object
                        properties:
                          currency_code:
                            enum:
                            - EUR
                            - USD
                          value:
                            type: string
                            pattern: ^[0-9]{1,6}\.[0-9]{2}$
                        required:
                        - currency_code
                        - value
                    required:
                    - custom_id
                    - amount
              required:
              - intent
              - purchase_units
  /v2/checkout/orders/{id}:
    get:
      summary: Retrieve current order state
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: *id001
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid local credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Merchant not allowed
          content:
            application/json:
              schema:
