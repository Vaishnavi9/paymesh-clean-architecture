spring.application.name=paymesh-provider-simulator
server.address=${BIND_ADDRESS:127.0.0.1}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s
provider.kind=${PROVIDER_KIND:stripe}
provider.database=${PROVIDER_DATABASE:provider_stripe}
provider.mongo-uri=${MONGO_URI:mongodb://127.0.0.1:27028/?replicaSet=rs0&directConnection=true&serverSelectionTimeoutMS=5000}
provider.api-key=${PROVIDER_API_KEY:local-stripe-key}
provider.admin-key=${PROVIDER_ADMIN_KEY:local-admin-key}
provider.webhook-url=${PROVIDER_WEBHOOK_URL:}
provider.webhook-secret=${PROVIDER_WEBHOOK_SECRET:local-webhook-secret}
provider.processing-delay-ms=2000
provider.retry-base-ms=1000
provider.max-attempts=5
provider.lease-ms=30000
provider.workers-enabled=true
server.port=18101
logging.level.org.mongodb.driver=WARN
server.error.include-message=never
server.error.include-stacktrace=never
