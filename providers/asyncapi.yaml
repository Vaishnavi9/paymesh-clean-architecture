asyncapi: 3.0.0
id: urn:paymesh:local-provider-webhooks
info:
  title: PayMesh local provider simulators — outgoing webhooks
  version: 1.0.0
  description: |
    Contract of the IMPLEMENTED local simulator senders, not official vendor APIs.
    Stripe and Adyen senders use Spring Boot; the PayPal sender uses Quarkus.
    Each process sends HTTP POSTs to its operator-configured PROVIDER_WEBHOOK_URL.
    No destination or webhook receiver is enabled by default.
    Channel addresses are unknown until configuration; this document starts no services.
    Kafka and SQS are not connected in this milestone.
defaultContentType: application/json
x-simulator-only: true
x-delivery:
  persistence: Payment changes and outgoing event records commit in one MongoDB transaction.
  duplicates: Retried delivery can repeat an event. Deduplicate X-Simulator-Event-Id durably.
  ordering: No per-payment ordering guarantee across concurrent workers and retries.
  acknowledgement: Any HTTP 2xx marks the outgoing job DELIVERED.
  retry: Network errors, HTTP 408, 429 and 5xx are retryable.
  terminal-failure: Other non-2xx replies, or exhausted attempts, mark the job DEAD.
  default-max-attempts: 5
  backoff: Configurable exponential backoff, capped at 30 seconds before adding up to 25 percent jitter.
  request-timeout-seconds: 3
  limitation: No Retry-After handling, exactly-once delivery, or guarantee of eventual receipt.
  receiver-guidance: Verify raw-body HMAC and timestamp tolerance before deduplication and state updates.
channels:
  stripeWebhook:
    address: null
    title: Stripe-inspired event destination
    description: Full destination comes from this service's PROVIDER_WEBHOOK_URL.
    messages:
      event:
        $ref: '#/components/messages/StripeEvent'
  adyenWebhook:
    address: null
    title: Adyen-inspired event destination
    description: Full destination comes from this service's PROVIDER_WEBHOOK_URL.
    messages:
      event:
        $ref: '#/components/messages/AdyenEvent'
  paypalWebhook:
    address: null
    title: PayPal-inspired event destination
    description: Full destination comes from this service's PROVIDER_WEBHOOK_URL.
    messages:
      event:
        $ref: '#/components/messages/PayPalEvent'
operations:
  sendStripeEvent:
    action: send
    summary: Deliver a saved Stripe-inspired payment event
    channel:
      $ref: '#/channels/stripeWebhook'
    messages:
      - $ref: '#/channels/stripeWebhook/messages/event'
    bindings:
      http:
        method: POST
        bindingVersion: 0.3.0
  sendAdyenEvent:
    action: send
    summary: Deliver a saved Adyen-inspired authorisation, capture or local review event
    channel:
      $ref: '#/channels/adyenWebhook'
    messages:
      - $ref: '#/channels/adyenWebhook/messages/event'
    bindings:
      http:
        method: POST
        bindingVersion: 0.3.0
  sendPayPalEvent:
    action: send
    summary: Deliver a saved PayPal-inspired capture or simulator-only event
    channel:
      $ref: '#/channels/paypalWebhook'
    messages:
      - $ref: '#/channels/paypalWebhook/messages/event'
    bindings:
      http:
        method: POST
        bindingVersion: 0.3.0
components:
  correlationIds:
    deliveryEventId:
      description: Stable event ID across attempts; distinct from the payment ID and HTTP idempotency key.
      location: '$message.header#/X-Simulator-Event-Id'
  messages:
    StripeEvent:
      name: StripeInspiredPaymentEvent
      title: Stripe-inspired local webhook
      summary: Authorisation, capture or decline notification from the simulator
      contentType: application/json
      description: Native Stripe signature headers and full event envelopes are not implemented.
      headers:
        $ref: '#/components/schemas/DeliveryHeaders'
      correlationId:
        $ref: '#/components/correlationIds/deliveryEventId'
      payload:
        $ref: '#/components/schemas/StripeEventBody'
    AdyenEvent:
      name: AdyenInspiredPaymentEvent
      title: Adyen-inspired local webhook
      summary: One notification item per delivery in this simulator
      contentType: application/json
      description: |
        Boolean flags are strings in this envelope. The stable event ID is in the HTTP header.
        SIMULATOR_REVIEW_REQUIRED is a local extension, not a native Adyen event.
        Local CAPTURE means the simplified internal transfer completed; real Adyen
        capture submission and banking settlement have further stages and possible failures.
      headers:
        $ref: '#/components/schemas/DeliveryHeaders'
      correlationId:
        $ref: '#/components/correlationIds/deliveryEventId'
      payload:
        $ref: '#/components/schemas/AdyenEventBody'
    PayPalEvent:
      name: PayPalInspiredPaymentEvent
      title: PayPal-inspired local webhook
      summary: Capture completed, internal authorisation, or decline in the local model
      contentType: application/json
      description: |
        This simulator sends an ORDER-shaped resource, including for PAYMENT.CAPTURE.COMPLETED.
        Real PayPal capture-completed notifications describe a capture resource.
        SIMULATOR.AUTHORISED and SIMULATOR.DECLINED are local-only event types.
        Buyer approval itself emits no event here. This is not wire-compatible with PayPal.
      headers:
        $ref: '#/components/schemas/DeliveryHeaders'
      correlationId:
        $ref: '#/components/correlationIds/deliveryEventId'
      payload:
        $ref: '#/components/schemas/PayPalEventBody'
  schemas:
    DeliveryHeaders:
      type: object
      required: [X-Simulator-Event-Id, X-Simulator-Timestamp, X-Simulator-Signature]
      properties:
        X-Simulator-Event-Id:
          type: string
          pattern: '^evt_[a-f0-9]{32}$'
          description: Unchanged on retries; use this for deduplication.
        X-Simulator-Timestamp:
          type: string
          pattern: '^[0-9]+$'
          description: Unix epoch seconds, regenerated on each delivery attempt.
        X-Simulator-Signature:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: |
            Lowercase hex HMAC-SHA256(PROVIDER_WEBHOOK_SECRET, timestamp + "." + exact raw JSON body).
            This is a simulator-specific scheme shared by all three services.
            Re-serialising parsed JSON before verification changes the signed bytes.
    EventId:
      type: string
      pattern: '^evt_[a-f0-9]{32}$'
    MinorAmount:
      type: integer
      minimum: 1
      description: Integer minor units; only two-decimal EUR and USD are supported.
    DecimalAmount:
      type: object
      additionalProperties: false
      required: [currency_code, value]
      properties:
        currency_code:
          type: string
          enum: [EUR, USD]
        value:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
    StripeEventBody:
      type: object
      additionalProperties: false
      required: [id, object, type, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        object:
          type: string
          const: event
        type:
          type: string
          enum: [payment_intent.amount_capturable_updated, payment_intent.succeeded, payment_intent.payment_failed]
        data:
          type: object
          additionalProperties: false
          required: [object]
          properties:
            object:
              $ref: '#/components/schemas/StripePayment'
    StripePayment:
      type: object
      additionalProperties: false
      required: [id, object, amount, currency, status, payment_method, capture_method, amount_received, amount_capturable, metadata]
      properties:
        id:
          type: string
          pattern: '^pi_[a-f0-9]{32}$'
        object:
          type: string
          const: payment_intent
        amount:
          $ref: '#/components/schemas/MinorAmount'
        currency:
          type: string
          enum: [eur, usd]
        status:
          type: string
          enum: [requires_capture, succeeded, requires_payment_method]
        payment_method:
          type: string
          enum: [pm_funded, pm_low, pm_blocked, pm_usd]
        capture_method:
          type: string
          enum: [manual, automatic]
        amount_received:
          type: integer
          minimum: 0
        amount_capturable:
          type: integer
          minimum: 0
        metadata:
          type: object
          additionalProperties: false
          required: [order_reference]
          properties:
            order_reference:
              type: string
        last_payment_error:
          type: object
          additionalProperties: false
          required: [type, code, decline_code]
          properties:
            type:
              type: string
              const: card_error
            code:
              type: string
              const: card_declined
            decline_code:
              type: string
    AdyenEventBody:
      type: object
      additionalProperties: false
      required: [live, notificationItems]
      properties:
        live:
          type: string
          const: 'false'
        notificationItems:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [NotificationRequestItem]
            properties:
              NotificationRequestItem:
                $ref: '#/components/schemas/AdyenNotification'
    AdyenNotification:
      type: object
      additionalProperties: false
      required: [pspReference, originalReference, merchantReference, merchantAccountCode, eventCode, success, eventDate, amount]
      properties:
        pspReference:
          type: string
          pattern: '^psp_(capture_)?[a-f0-9]{32}$'
        originalReference:
          type: [string, 'null']
          description: The payment reference for CAPTURE; null for authorisation or local review.
        merchantReference:
          type: string
        merchantAccountCode:
          type: string
          const: merchant-demo
        eventCode:
          type: string
          enum: [AUTHORISATION, CAPTURE, SIMULATOR_REVIEW_REQUIRED]
        success:
          type: string
          enum: ['true', 'false']
        eventDate:
          type: string
          format: date-time
        amount:
          type: object
          additionalProperties: false
          required: [value, currency]
          properties:
            value:
              $ref: '#/components/schemas/MinorAmount'
            currency:
              type: string
              enum: [EUR, USD]
    PayPalEventBody:
      type: object
      additionalProperties: false
      required: [id, event_type, resource]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event_type:
          type: string
          enum: [PAYMENT.CAPTURE.COMPLETED, SIMULATOR.AUTHORISED, SIMULATOR.DECLINED]
        resource:
          $ref: '#/components/schemas/PayPalOrder'
    PayPalOrder:
      type: object
      additionalProperties: false
      required: [id, status, intent, purchase_units, links]
      properties:
        id:
          type: string
          pattern: '^order_[a-f0-9]{32}$'
        status:
          type: string
          enum: [APPROVED, COMPLETED]
        intent:
          type: string
          const: CAPTURE
        purchase_units:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [custom_id, amount]
            properties:
              custom_id:
                type: string
              amount:
                $ref: '#/components/schemas/DecimalAmount'
              payments:
                type: object
                additionalProperties: false
                required: [captures]
                properties:
                  captures:
                    type: array
                    minItems: 1
                    maxItems: 1
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, status, amount]
                      properties:
                        id:
                          type: string
                          pattern: '^cap_order_[a-f0-9]{32}$'
                        status:
                          type: string
                          const: COMPLETED
                        amount:
                          $ref: '#/components/schemas/DecimalAmount'
        links:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [rel, method, href]
            properties:
              rel:
                type: string
                const: self
              method:
                type: string
                const: GET
              href:
                type: string
                pattern: '^/v2/checkout/orders/order_[a-f0-9]{32}$'
