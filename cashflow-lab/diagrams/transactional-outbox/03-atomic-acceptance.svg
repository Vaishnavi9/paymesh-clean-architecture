<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" role="img" aria-labelledby="svgTitle"><title id="svgTitle">Atomic payment and outbox insertion in one PostgreSQL transaction</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs><rect width="1120" height="780" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#181818"><g class="node plain"><rect x="55" y="45" width="300" height="85" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="205.0" y="79.98" text-anchor="middle" font-size="22" font-weight="500">Validate request</text><text x="205.0" y="109.98" text-anchor="middle" font-size="22" font-weight="500">and authenticated merchant</text></g><polyline points="355,87 460,87" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="node plain"><rect x="460" y="45" width="605" height="85" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="762.5" y="79.98" text-anchor="middle" font-size="22" font-weight="500">New idempotency key</text><text x="762.5" y="109.98" text-anchor="middle" font-size="22" font-weight="500">duplicate branch shown in step 7</text></g><rect x="55" y="175" width="1010" height="430" rx="10" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="8 5"/><text x="75" y="207" text-anchor="start" font-size="19" font-weight="500">ONE POSTGRESQL TRANSACTION — new acceptance</text><g class="node soft"><rect x="95" y="245" width="365" height="90" rx="6" fill="#f4f4f2" stroke="#222" stroke-width="2"/><text x="277.5" y="282.48" text-anchor="middle" font-size="22" font-weight="500">Insert payment_requests</text><text x="277.5" y="312.48" text-anchor="middle" font-size="22" font-weight="500">status = ACCEPTED</text></g><g class="node soft"><rect x="635" y="245" width="365" height="90" rx="6" fill="#f4f4f2" stroke="#222" stroke-width="2"/><text x="817.5" y="282.48" text-anchor="middle" font-size="22" font-weight="500">Insert outbox_messages</text><text x="817.5" y="312.48" text-anchor="middle" font-size="22" font-weight="500">status = PENDING</text></g><polyline points="460,290 635,290" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="461.0" y="248" width="174.0" height="28" fill="white"/><text x="548" y="268" text-anchor="middle" font-size="18" font-weight="500">Same connection</text><polyline points="760,130 760,155 610,155 610,220 277,220 277,245" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="652.0" y="131" width="66.0" height="28" fill="white"/><text x="685" y="151" text-anchor="middle" font-size="18" font-weight="500">Begin</text><polygon points="815,380.0 965.0,455 815,530.0 665.0,455" fill="#f4f4f2" stroke="#222" stroke-width="2"/><text x="815" y="447.64" text-anchor="middle" font-size="21" font-weight="500">Both writes</text><text x="815" y="476.64" text-anchor="middle" font-size="21" font-weight="500">succeeded?</text><polyline points="815,335 815,380" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="node plain"><rect x="95" y="415" width="365" height="80" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="277.5" y="447.48" text-anchor="middle" font-size="22" font-weight="500">Rollback</text><text x="277.5" y="477.48" text-anchor="middle" font-size="22" font-weight="500">neither new row remains</text></g><polyline points="665,455 460,455" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="548.2" y="415" width="33.6" height="28" fill="white"/><text x="565" y="435" text-anchor="middle" font-size="18" font-weight="500">No</text><g class="node dark"><rect x="665" y="555" width="300" height="45" rx="6" fill="#181818" stroke="#222" stroke-width="2"/><g fill="white"><text x="815.0" y="584.98" text-anchor="middle" font-size="22" font-weight="500">COMMIT</text></g></g><polyline points="815,530 815,555" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="847.8" y="528" width="44.400000000000006" height="28" fill="white"/><text x="870" y="548" text-anchor="middle" font-size="18" font-weight="500">Yes</text><g class="node plain"><rect x="665" y="670" width="300" height="75" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="815.0" y="699.98" text-anchor="middle" font-size="22" font-weight="500">202 Accepted</text><text x="815.0" y="729.98" text-anchor="middle" font-size="22" font-weight="500">payment ID + status URL</text></g><polyline points="815,600 815,670" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="744.2" y="620" width="141.60000000000002" height="28" fill="white"/><text x="815" y="640" text-anchor="middle" font-size="18" font-weight="500">After commit</text><g class="node plain"><rect x="95" y="670" width="365" height="75" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="277.5" y="699.98" text-anchor="middle" font-size="22" font-weight="500">Failure response</text><text x="277.5" y="729.98" text-anchor="middle" font-size="22" font-weight="500">no successful acceptance</text></g><polyline points="277,495 277,670" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/></g></svg>