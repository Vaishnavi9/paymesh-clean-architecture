<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-labelledby="svgTitle"><title id="svgTitle">One illustrative payment moving through acceptance and publication</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs><rect width="1120" height="440" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#181818"><g id="tracePayment" class="node soft"><rect x="45" y="140" width="270" height="110" rx="6" fill="#f4f4f2" stroke="#222" stroke-width="2"/><text x="180.0" y="187.48" text-anchor="middle" font-size="22" font-weight="500">P-101</text><text x="180.0" y="217.48" text-anchor="middle" font-size="22" font-weight="500">payment request</text></g><g id="traceOutbox" class="node soft"><rect x="425" y="140" width="270" height="110" rx="6" fill="#f4f4f2" stroke="#222" stroke-width="2"/><text x="560.0" y="187.48" text-anchor="middle" font-size="22" font-weight="500">M-501</text><text x="560.0" y="217.48" text-anchor="middle" font-size="22" font-weight="500">outbox command</text></g><g id="traceBroker" class="node plain"><rect x="805" y="140" width="270" height="110" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="940.0" y="187.48" text-anchor="middle" font-size="22" font-weight="500">SQS</text><text x="940.0" y="217.48" text-anchor="middle" font-size="22" font-weight="500">broker</text></g><polyline points="315,195 425,195" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="277.6" y="145" width="184.8" height="28" fill="white"/><text x="370" y="165" text-anchor="middle" font-size="18" font-weight="500">Same transaction</text><polyline points="695,195 805,195" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="673.8" y="145" width="152.4" height="28" fill="white"/><text x="750" y="165" text-anchor="middle" font-size="18" font-weight="500">Publish later</text><rect x="25" y="85" width="690" height="235" rx="10" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="8 5"/><text x="45" y="117" text-anchor="start" font-size="19" font-weight="500">POSTGRESQL — UUID labels shortened for teaching</text><text x="555" y="385" text-anchor="middle" font-size="24" font-weight="500">ACCEPTED ≠ PUBLISHED ≠ successfully charged</text></g></svg>