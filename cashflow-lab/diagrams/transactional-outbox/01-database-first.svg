<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 490" role="img" aria-labelledby="svgTitle"><title id="svgTitle">Unsafe order: database commit before message send</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs><rect width="1120" height="490" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#181818"><g class="node plain"><rect x="35" y="55" width="210" height="90" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="140.0" y="92.48" text-anchor="middle" font-size="22" font-weight="500">Customer</text><text x="140.0" y="122.48" text-anchor="middle" font-size="22" font-weight="500">Pay €25</text></g><g class="node plain"><rect x="325" y="55" width="245" height="90" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="447.5" y="92.48" text-anchor="middle" font-size="22" font-weight="500">PayMesh</text><text x="447.5" y="122.48" text-anchor="middle" font-size="22" font-weight="500">accept request</text></g><polyline points="245,100 325,100" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="257.4" y="60" width="55.2" height="28" fill="white"/><text x="285" y="80" text-anchor="middle" font-size="18" font-weight="500">POST</text><g class="node soft"><rect x="650" y="55" width="420" height="90" rx="6" fill="#f4f4f2" stroke="#222" stroke-width="2"/><text x="860.0" y="92.48" text-anchor="middle" font-size="22" font-weight="500">PostgreSQL</text><text x="860.0" y="122.48" text-anchor="middle" font-size="22" font-weight="500">payment committed</text></g><polyline points="570,100 650,100" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="566.2" y="60" width="87.60000000000001" height="28" fill="white"/><text x="610" y="80" text-anchor="middle" font-size="18" font-weight="500">1. Save</text>