<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="svgTitle"><title id="svgTitle">Two relay choices with a common durable outbox</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs><rect width="1120" height="520" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#181818"><g class="node soft"><rect x="380" y="45" width="360" height="100" rx="6" fill="#f4f4f2" stroke="#222" stroke-width="2"/><text x="560.0" y="87.48" text-anchor="middle" font-size="22" font-weight="500">Payment + outbox</text><text x="560.0" y="117.48" text-anchor="middle" font-size="22" font-weight="500">one database commit</text></g><g class="node plain"><rect x="40" y="245" width="450" height="110" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="265.0" y="292.48" text-anchor="middle" font-size="22" font-weight="500">Polling publisher</text><text x="265.0" y="322.48" text-anchor="middle" font-size="22" font-weight="500">read due rows + retry bookkeeping</text></g><g class="node plain"><rect x="630" y="245" width="450" height="110" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="855.0" y="292.48" text-anchor="middle" font-size="22" font-weight="500">CDC publisher</text><text x="855.0" y="322.48" text-anchor="middle" font-size="22" font-weight="500">read committed change stream</text></g><polyline points="450,145 450,195 265,195 265,245" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="215.8" y="165" width="98.4" height="28" fill="white"/><text x="265" y="185" text-anchor="middle" font-size="18" font-weight="500">Option A</text><polyline points="670,145 670,195 855,195 855,245" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="805.8" y="165" width="98.4" height="28" fill="white"/><text x="855" y="185" text-anchor="middle" font-size="18" font-weight="500">Option B</text><g class="node plain"><rect x="380" y="420" width="360" height="70" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="560.0" y="462.48" text-anchor="middle" font-size="22" font-weight="500">Broker → idempotent consumer</text></g><polyline points="265,355 265,455 380,455" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="855,355 855,455 740,455" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/></g></svg>