<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="svgTitle"><title id="svgTitle">Request idempotency decisions inside the acceptance transaction</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs><rect width="1120" height="700" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#181818"><g class="node plain"><rect x="320" y="35" width="480" height="80" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="560.0" y="82.48" text-anchor="middle" font-size="22" font-weight="500">Merchant + idempotency key</text></g><g class="node plain"><rect x="320" y="175" width="480" height="80" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="560.0" y="207.64" text-anchor="middle" font-size="21" font-weight="500">INSERT payment</text><text x="560.0" y="236.64" text-anchor="middle" font-size="21" font-weight="500">ON CONFLICT DO NOTHING</text></g><polyline points="560,115 560,175" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="456.8" y="130" width="206.4" height="28" fill="white"/><text x="560" y="150" text-anchor="middle" font-size="18" font-weight="500">Inside transaction</text><polygon points="560,285.0 695.0,355 560,425.0 425.0,355" fill="#f4f4f2" stroke="#222" stroke-width="2"/><text x="560" y="362.14" text-anchor="middle" font-size="21" font-weight="500">Inserted?</text><polyline points="560,255 560,285" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="node soft"><rect x="45" y="305" width="300" height="100" rx="6" fill="#f4f4f2" stroke="#222" stroke-width="2"/><text x="195.0" y="347.48" text-anchor="middle" font-size="22" font-weight="500">Create initial outbox</text><text x="195.0" y="377.48" text-anchor="middle" font-size="22" font-weight="500">commit both rows</text></g><polyline points="425,355 345,355" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="362.8" y="315" width="44.400000000000006" height="28" fill="white"/><text x="385" y="335" text-anchor="middle" font-size="18" font-weight="500">Yes</text><g class="node plain"><rect x="800" y="305" width="280" height="100" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="940.0" y="347.8" text-anchor="middle" font-size="20" font-weight="500">Read stored request</text><text x="940.0" y="375.8" text-anchor="middle" font-size="20" font-weight="500">and fingerprint</text></g><polyline points="695,355 800,355" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="730.2" y="315" width="33.6" height="28" fill="white"/><text x="747" y="335" text-anchor="middle" font-size="18" font-weight="500">No</text><polygon points="940,455.0 1065.0,525 940,595.0 815.0,525" fill="#f4f4f2" stroke="#222" stroke-width="2"/><text x="940" y="517.64" text-anchor="middle" font-size="21" font-weight="500">Same</text><text x="940" y="546.64" text-anchor="middle" font-size="21" font-weight="500">fingerprint?</text><polyline points="940,405 940,455" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="node soft"><rect x="360" y="480" width="360" height="90" rx="6" fill="#f4f4f2" stroke="#222" stroke-width="2"/><text x="540.0" y="517.64" text-anchor="middle" font-size="21" font-weight="500">Return original acceptance</text><text x="540.0" y="546.64" text-anchor="middle" font-size="21" font-weight="500">no new command</text></g><polyline points="815,525 720,525" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="742.8" y="485" width="44.400000000000006" height="28" fill="white"/><text x="765" y="505" text-anchor="middle" font-size="18" font-weight="500">Yes</text><g class="node plain"><rect x="800" y="625" width="280" height="55" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="940.0" y="659.98" text-anchor="middle" font-size="22" font-weight="500">Reject key reuse</text></g><polyline points="940,595 940,625" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="973.2" y="600" width="33.6" height="28" fill="white"/><text x="990" y="620" text-anchor="middle" font-size="18" font-weight="500">No</text></g></svg>