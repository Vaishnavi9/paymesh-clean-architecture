<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" role="img" aria-labelledby="svgTitle"><title id="svgTitle">Proposed short publisher claim transaction and lease</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs><rect width="1120" height="690" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#181818"><rect x="35" y="35" width="1050" height="235" rx="10" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="8 5"/><text x="55" y="67" text-anchor="start" font-size="19" font-weight="500">SHORT CLAIM TRANSACTION — proposed schema extension</text><g class="node plain"><rect x="70" y="110" width="290" height="100" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="215.0" y="152.96" text-anchor="middle" font-size="19" font-weight="500">Find due PENDING rows</text><text x="215.0" y="179.96" text-anchor="middle" font-size="19" font-weight="500">FOR UPDATE SKIP LOCKED</text></g><g class="node plain"><rect x="445" y="110" width="290" height="100" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="590.0" y="152.64" text-anchor="middle" font-size="21" font-weight="500">Persist lease owner</text><text x="590.0" y="181.64" text-anchor="middle" font-size="21" font-weight="500">token + expiry</text></g><g class="node plain"><rect x="820" y="110" width="220" height="100" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="930.0" y="152.48" text-anchor="middle" font-size="22" font-weight="500">COMMIT</text><text x="930.0" y="182.48" text-anchor="middle" font-size="22" font-weight="500">release row locks</text></g><polyline points="360,160 445,160" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="735,160 820,160" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="node plain"><rect x="820" y="355" width="220" height="95" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="930.0" y="395.14" text-anchor="middle" font-size="21" font-weight="500">Send to SQS</text><text x="930.0" y="424.14" text-anchor="middle" font-size="21" font-weight="500">outside DB lock</text></g><polyline points="930,210 930,355" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><polygon points="575,327.5 710.0,400 575,472.5 440.0,400" fill="#f4f4f2" stroke="#222" stroke-width="2"/><text x="575" y="392.64" text-anchor="middle" font-size="21" font-weight="500">Lease token</text><text x="575" y="421.64" text-anchor="middle" font-size="21" font-weight="500">still ours?</text><polyline points="820,400 710,400" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="node soft"><rect x="55" y="350" width="300" height="100" rx="6" fill="#f4f4f2" stroke="#222" stroke-width="2"/><text x="205.0" y="392.64" text-anchor="middle" font-size="21" font-weight="500">Conditional update</text><text x="205.0" y="421.64" text-anchor="middle" font-size="21" font-weight="500">PUBLISHED or retry</text></g><polyline points="440,400 355,400" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="374.8" y="360" width="44.400000000000006" height="28" fill="white"/><text x="397" y="380" text-anchor="middle" font-size="18" font-weight="500">Yes</text><g class="node plain"><rect x="425" y="555" width="300" height="90" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="575.0" y="592.64" text-anchor="middle" font-size="21" font-weight="500">Stale owner stops</text><text x="575.0" y="621.64" text-anchor="middle" font-size="21" font-weight="500">preserve current claim</text></g><polyline points="575,473 575,555" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="558.2" y="500" width="33.6" height="28" fill="white"/><text x="575" y="520" text-anchor="middle" font-size="18" font-weight="500">No</text></g></svg>