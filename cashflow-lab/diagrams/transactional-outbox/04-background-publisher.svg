<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="svgTitle"><title id="svgTitle">Outbox publication after the acceptance transaction</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs><rect width="1120" height="720" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#181818"><g class="node soft"><rect x="50" y="45" width="400" height="90" rx="6" fill="#f4f4f2" stroke="#222" stroke-width="2"/><text x="250.0" y="82.48" text-anchor="middle" font-size="22" font-weight="500">Committed outbox row</text><text x="250.0" y="112.48" text-anchor="middle" font-size="22" font-weight="500">PENDING + due for delivery</text></g><g class="node plain"><rect x="660" y="45" width="400" height="90" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="860.0" y="97.48" text-anchor="middle" font-size="22" font-weight="500">Publisher claims a batch</text></g><polyline points="450,90 660,90" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="451.8" y="50" width="206.4" height="28" fill="white"/><text x="555" y="70" text-anchor="middle" font-size="18" font-weight="500">Read eligible work</text><g class="node plain"><rect x="660" y="210" width="400" height="80" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="860.0" y="257.48" text-anchor="middle" font-size="22" font-weight="500">Send command to SQS</text></g><polyline points="860,135 860,210" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><polygon points="860,325.0 1015.0,405 860,485.0 705.0,405" fill="#f4f4f2" stroke="#222" stroke-width="2"/><text x="860" y="397.8" text-anchor="middle" font-size="20" font-weight="500">Acknowledgement</text><text x="860" y="425.8" text-anchor="middle" font-size="20" font-weight="500">received?</text><polyline points="860,290 860,325" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="node plain"><rect x="50" y="355" width="400" height="100" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="250.0" y="397.48" text-anchor="middle" font-size="22" font-weight="500">Keep message for retry</text><text x="250.0" y="427.48" text-anchor="middle" font-size="22" font-weight="500">same application message_id</text></g><polyline points="705,405 450,405" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="504.2" y="365" width="141.60000000000002" height="28" fill="white"/><text x="575" y="385" text-anchor="middle" font-size="18" font-weight="500">No / unknown</text><polyline points="250,355 250,135" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="206.2" y="225" width="87.60000000000001" height="28" fill="white"/><text x="250" y="245" text-anchor="middle" font-size="18" font-weight="500">Backoff</text><g class="node soft"><rect x="660" y="565" width="400" height="95" rx="6" fill="#f4f4f2" stroke="#222" stroke-width="2"/><text x="860.0" y="604.98" text-anchor="middle" font-size="22" font-weight="500">Record PUBLISHED</text><text x="860.0" y="634.98" text-anchor="middle" font-size="22" font-weight="500">set published_at</text></g><polyline points="860,485 860,565" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="837.8" y="510" width="44.400000000000006" height="28" fill="white"/><text x="860" y="530" text-anchor="middle" font-size="18" font-weight="500">Yes</text><g class="node plain"><rect x="50" y="565" width="400" height="95" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="250.0" y="604.98" text-anchor="middle" font-size="22" font-weight="500">Crash before this update?</text><text x="250.0" y="634.98" text-anchor="middle" font-size="22" font-weight="500">A later send may repeat</text></g><polyline points="660,610 450,610" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="468.4" y="570" width="163.20000000000002" height="28" fill="white"/><text x="550" y="590" text-anchor="middle" font-size="18" font-weight="500">Failure window</text></g></svg>