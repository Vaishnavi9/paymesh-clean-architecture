<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="svgTitle"><title id="svgTitle">The publish-then-crash duplicate window</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs><rect width="1120" height="500" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#181818"><g class="node soft"><rect x="35" y="75" width="280" height="100" rx="6" fill="#f4f4f2" stroke="#222" stroke-width="2"/><text x="175.0" y="117.48" text-anchor="middle" font-size="22" font-weight="500">Outbox M-501</text><text x="175.0" y="147.48000000000002" text-anchor="middle" font-size="22" font-weight="500">PENDING</text></g><g class="node plain"><rect x="420" y="75" width="280" height="100" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="560.0" y="117.48" text-anchor="middle" font-size="22" font-weight="500">SQS accepts</text><text x="560.0" y="147.48000000000002" text-anchor="middle" font-size="22" font-weight="500">M-501 payload</text></g><g class="node dark"><rect x="805" y="75" width="280" height="100" rx="6" fill="#181818" stroke="#222" stroke-width="2"/><g fill="white"><text x="945.0" y="132.48" text-anchor="middle" font-size="22" font-weight="500">Publisher crashes</text></g></g><polyline points="315,125 420,125" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="339.4" y="83" width="55.2" height="28" fill="white"/><text x="367" y="103" text-anchor="middle" font-size="18" font-weight="500">Send</text><polyline points="700,125 805,125" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="729.8" y="83" width="44.400000000000006" height="28" fill="white"/><text x="752" y="103" text-anchor="middle" font-size="18" font-weight="500">Ack</text><g class="node plain"><rect x="805" y="325" width="280" height="90" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="945.0" y="377.48" text-anchor="middle" font-size="22" font-weight="500">No PUBLISHED update</text></g><polyline points="945,175 945,325" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="node plain"><rect x="420" y="325" width="280" height="90" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="560.0" y="362.48" text-anchor="middle" font-size="22" font-weight="500">Restart + retry</text><text x="560.0" y="392.48" text-anchor="middle" font-size="22" font-weight="500">same M-501</text></g><polyline points="805,370 700,370" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="node plain"><rect x="35" y="325" width="280" height="90" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="175.0" y="377.48" text-anchor="middle" font-size="22" font-weight="500">Possible second delivery</text></g><polyline points="420,370 315,370" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/></g></svg>