<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 490" role="img" aria-labelledby="svgTitle"><title id="svgTitle">Unsafe order: message send before database commit</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs><rect width="1120" height="490" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#181818"><g class="node plain"><rect x="40" y="70" width="240" height="90" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="160.0" y="107.48" text-anchor="middle" font-size="22" font-weight="500">PayMesh</text><text x="160.0" y="137.48000000000002" text-anchor="middle" font-size="22" font-weight="500">accept request</text></g><g class="node soft"><rect x="365" y="70" width="300" height="90" rx="6" fill="#f4f4f2" stroke="#222" stroke-width="2"/><text x="515.0" y="107.48" text-anchor="middle" font-size="22" font-weight="500">SQS</text><text x="515.0" y="137.48000000000002" text-anchor="middle" font-size="22" font-weight="500">command accepted</text></g><g class="node plain"><rect x="760" y="70" width="320" height="90" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="920.0" y="107.48" text-anchor="middle" font-size="22" font-weight="500">Worker</text><text x="920.0" y="137.48000000000002" text-anchor="middle" font-size="22" font-weight="500">may already act</text></g><polyline points="280,115 365,115" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="278.2" y="75" width="87.60000000000001" height="28" fill="white"/><text x="322" y="95" text-anchor="middle" font-size="18" font-weight="500">1. Send</text><polyline points="665,115 760,115" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="668.2" y="75" width="87.60000000000001" height="28" fill="white"/><text x="712" y="95" text-anchor="middle" font-size="18" font-weight="500">Receive</text><g class="node dark"><rect x="40" y="290" width="400" height="90" rx="6" fill="#181818" stroke="#222" stroke-width="2"/><g fill="white"><text x="240.0" y="342.48" text-anchor="middle" font-size="22" font-weight="500">PostgreSQL commit fails</text></g></g><polyline points="160,160 160,290" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="83.8" y="210" width="152.4" height="28" fill="white"/><text x="160" y="230" text-anchor="middle" font-size="18" font-weight="500">2. Save fails</text><g class="node plain"><rect x="560" y="290" width="520" height="90" rx="6" fill="white" stroke="#222" stroke-width="2"/><text x="820.0" y="327.48" text-anchor="middle" font-size="22" font-weight="500">No committed payment</text><text x="820.0" y="357.48" text-anchor="middle" font-size="22" font-weight="500">but a command can be processed</text></g><polyline points="440,335 560,335" fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="450.8" y="295" width="98.4" height="28" fill="white"/><text x="500" y="315" text-anchor="middle" font-size="18" font-weight="500">Mismatch</text></g></svg>