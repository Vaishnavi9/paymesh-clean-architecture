# Optional connection profile. Use AWS_PROFILE=paymesh-sqs-dev after aws login.
# Credentials come from the SDK default provider chain, never from this file.
# SQS publication is enabled only with db,acceptance,aws,outbox.
app.aws.region=${AWS_REGION:eu-central-1}
# Select a bucket before implementing report uploads. No bucket is provisioned.
app.aws.report-bucket=${PAYMENT_REPORT_BUCKET:}
app.aws.report-prefix=practice/payment-batches/
app.aws.sqs.queue-name=paymesh-payment-requests
