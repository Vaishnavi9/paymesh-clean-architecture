# Activate in this order: db,acceptance (add aws,outbox only for delivery).
server.port=18081
app.database.url=${DB_URL:jdbc:postgresql://localhost:15432/paymesh_acceptance}
app.payments.demo-merchant-id=10000000-0000-4000-8000-000000000001
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false
app.outbox.scan-delay-ms=1000
